# LLM-powered (Groq) security and quality gate for pull requests (https://github.com/MehdiSehlouli/ai-pr-gate).
# Make "AI quality gate" a required status check on main so failed PRs can't be merged.
name: AI quality gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write # for the PR comment

concurrency:
  group: ai-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  audit:
    name: AI quality gate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the gate diffs against the merge base

      - name: AI quality gate
        uses: MehdiSehlouli/ai-pr-gate@v0.2.2
        with:
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-gate-report
          path: ai-gate-report/
          if-no-files-found: ignore
